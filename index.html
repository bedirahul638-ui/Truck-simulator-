<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Indian Truck Simulator 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#8fc7ec;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;color:white;pointer-events:none}
.panel{background:#142331e8;border:1px solid #ffffff35;border-radius:13px;padding:10px 12px;text-shadow:0 2px 3px #000}
#speed{font-size:25px;font-weight:bold}
.small{font-size:11px;color:#d6e3ee;margin-top:4px}
#mission{position:fixed;top:82px;left:10px;background:#142331df;color:white;border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.5}
#hint{position:fixed;bottom:112px;left:0;right:0;text-align:center;color:white;text-shadow:0 2px 4px #000;font-size:12px;pointer-events:none}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 13px;gap:8px}
.group{display:flex;gap:8px;align-items:center}
button{color:white;background:#142331e8;border:1px solid #ffffff60;border-radius:18px;width:62px;height:65px;font-size:23px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}
button.active,button:active{background:#247fc0}
.pedal{width:70px;height:76px;font-size:12px}
#gas{background:#167951e8}
#cameraBtn{position:fixed;right:12px;top:145px;width:auto;height:43px;padding:0 13px;font-size:12px;border-radius:12px}
#start{position:fixed;inset:0;background:#091522b9;display:flex;align-items:center;justify-content:center;padding:24px;color:white;text-align:center}
.card{max-width:330px;background:#142331f5;border:1px solid #ffffff30;padding:24px;border-radius:20px}
.card h1{font-size:24px}
.card p{font-size:14px;line-height:1.5;color:#d4e1eb}
#play{width:100%;height:52px;font-size:15px;margin-top:8px;background:#147d52}
@media(max-height:450px){
#controls{bottom:6px}button{height:50px;width:53px}.pedal{height:58px;width:62px}
#hint{bottom:70px}#cameraBtn{top:105px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="panel">
    <div id="speed">0 <span style="font-size:12px">km/h</span></div>
    <div class="small">TRUCK SPEED</div>
  </div>
  <div class="panel" style="text-align:right">
    <div id="money" style="font-size:20px;font-weight:bold">₹ 0</div>
    <div class="small">DELIVERY REWARD</div>
  </div>
</div>

<div id="mission">📦 Cargo delivery<br><b id="distance">Distance: 2.00 km</b></div>
<button id="cameraBtn">📷 CAMERA: FOLLOW</button>
<div id="hint">◀ STEER LEFT / RIGHT ▶</div>

<div id="controls">
  <div class="group">
    <button id="left" aria-label="Steer left">◀</button>
    <button id="right" aria-label="Steer right">▶</button>
  </div>
  <div class="group">
    <button id="brake" class="pedal">BRAKE</button>
    <button id="gas" class="pedal">GAS ▲</button>
  </div>
</div>

<div id="start">
  <div class="card">
    <div style="font-size:48px">🚛</div>
    <h1>Indian Truck Simulator</h1>
    <p>Drive your upgraded cargo truck on an Indian-style highway.</p>
    <p>Hold GAS to accelerate. Use the arrows to steer and BRAKE to slow down.</p>
    <button id="play">START DRIVING</button>
    <div class="small">3D Truck • Realistic Edition</div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const root = document.getElementById('game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.0035);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

// Lighting Setup for Realism
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const sunlight = new THREE.DirectionalLight(0xfffaf0, 1.8);
sunlight.position.set(30, 50, 20);
sunlight.castShadow = true;
sunlight.shadow.mapSize.width = 2048;
sunlight.shadow.mapSize.height = 2048;
sunlight.shadow.camera.near = 0.5;
sunlight.shadow.camera.far = 150;
const d = 25;
sunlight.shadow.camera.left = -d;
sunlight.shadow.camera.right = d;
sunlight.shadow.camera.top = d;
sunlight.shadow.camera.bottom = -d;
scene.add(sunlight);

function material(color, roughness=0.7, metalness=0.1){
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

const blue = material(0x0968ac, 0.3, 0.3);
const blueDark = material(0x053c64, 0.4, 0.2);
const rubber = material(0x1a1a1a, 0.9, 0.1);
const chrome = material(0xddeeff, 0.1, 0.9);
const black = material(0x111111, 0.8, 0.2);
const glass = material(0x112233, 0.1, 0.9);
const white = material(0xfafafa, 0.5, 0.1);
const amber = material(0xff9900, 0.3, 0.2);
const red = material(0xcc1111, 0.3, 0.2);
const darkGrey = material(0x2b333b, 0.6, 0.2);
const cargoMat = material(0xc5d1d9, 0.5, 0.1);
const green = material(0x4c8c44, 0.9, 0.0);
const roadMat = material(0x22262a, 0.9, 0.1);
const roadLine = material(0xf2ebd9, 0.8, 0.0);
const treeTrunk = material(0x5c4033, 0.9, 0.0);
const treeLeaves = material(0x2e6630, 0.8, 0.0);

function box(parent, w, h, d, mat, x, y, z, castShadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = castShadow;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function cylinder(parent, r1, r2, h, mat, x, y, z, segments=16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, segments), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// World Ground and Highway
const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), green);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.1, -200);
ground.receiveShadow = true;
scene.add(ground);

box(scene, 12, 0.15, 500, roadMat, 0, -0.02, -200, false);

for(const x of [-5.6, 5.6]){
  box(scene, 0.18, 0.03, 500, roadLine, x, 0.03, -200, false);
}

const dashes = [];
for(let z = -400; z < 20; z += 10){
  dashes.push(box(scene, 0.15, 0.03, 4, roadLine, 0, 0.03, z, false));
}

// Truck Assembly
const truck = new THREE.Group();
scene.add(truck);

box(truck, 2.1, 0.4, 6.2, darkGrey, 0, 0.75, -0.1);
box(truck, 1.85, 0.15, 5.8, black, 0, 0.5, -0.1);

// Rear Trailer Cargo
const trailer = new THREE.Group();
truck.add(trailer);

box(trailer, 2.4, 2.1, 4.2, cargoMat, 0, 1.9, -1.2);
box(trailer, 2.45, 0.12, 4.4, darkGrey, 0, 0.8, -1.2);

for(let z of [-2.7, -1.7, -0.7, 0.3]){
  box(trailer, 2.42, 2.0, 0.04, material(0xaebbc4), 0, 1.9, z);
}

for(let y of [0.9, 2.9]){
  box(trailer, 2.5, 0.08, 4.45, chrome, 0, y, -1.2);
}

// Cabin
const cabin = new THREE.Group();
truck.add(cabin);

box(cabin, 2.15, 1.55, 1.75, blue, 0, 1.6, 1.1);
box(cabin, 1.98, 0.45, 0.75, blue, 0, 1.0, 2.0);
box(cabin, 2.2, 0.15, 1.8, blueDark, 0, 2.45, 1.1);
box(cabin, 1.8, 0.75, 0.05, glass, 0, 2.0, 2.05);

for(const side of [-1, 1]){
  box(cabin, 0.05, 0.6, 0.75, glass, side * 1.09, 2.0, 1.1);
  box(cabin, 0.35, 0.1, 0.55, chrome, side * 1.05, 0.7, 1.15);
  cylinder(cabin, 0.22, 0.22, 0.7, chrome, side * 0.85, 0.65, -0.2, 16).rotation.z = Math.PI/2;
}

box(cabin, 1.2, 0.55, 0.08, darkGrey, 0, 1.1, 2.4);
box(cabin, 2.25, 0.25, 0.3, chrome, 0, 0.7, 2.45);

// Wheels Setup
const wheels = [];
const frontWheels = [];

function addWheel(x, z, isFront=false){
  const wheel = new THREE.Group();
  wheel.position.set(x, 0.5, z);
  truck.add(wheel);

  const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.3, 24), rubber);
  tire.rotation.z = Math.PI / 2;
  tire.castShadow = true;
  wheel.add(tire);

  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.32, 16), chrome);
  rim.rotation.z = Math.PI / 2;
  wheel.add(rim);

  wheels.push(wheel);
  if(isFront) frontWheels.push(wheel);
}

for(const side of [-1, 1]){
  addWheel(side * 1.15, 1.6, true);
  addWheel(side * 1.15, -0.9, false);
  addWheel(side * 1.15, -2.4, false);
}

// Scenery (Trees and Buildings)
const scenery = [];

function addTree(x, z){
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  scene.add(group);
  cylinder(group, 0.15, 0.22, 1.4, treeTrunk, 0, 0.7, 0, 8);
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.5, 7), treeLeaves);
  leaves.position.y = 2.4;
  leaves.castShadow = true;
  group.add(leaves);
  scenery.push(group);
}

function addBuilding(x, z){
  const h = 3 + Math.random() * 3;
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  scene.add(group);
  box(group, 3.5, h, 3.5, material(0xc8b29c), 0, h/2, 0);
  scenery.push(group);
}

for(let z = -300; z < 20; z += 14){
  addTree(-10 - Math.random() * 8, z);
  addTree(10 + Math.random() * 8, z - 6);
  if(z % 42 === 0){
    addBuilding(-16, z - 10);
    addBuilding(16, z - 25);
  }
}

// Game State & Controls
const keys = { left: false, right: false, gas: false, brake: false };

function bind(id, key){
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); keys[key] = true; el.classList.add('active'); try{el.setPointerCapture(e.pointerId)}catch(_){} };
  const up = e => { e.preventDefault(); keys[key] = false; el.classList.remove('active'); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

bind('left', 'left');
bind('right', 'right');
bind('gas', 'gas');
bind('brake', 'brake');

let started = false;
let speed = 0;
let truckX = 0;
let distanceTravelled = 0;
let completed = false;
let firstPerson = false;

document.getElementById('play').addEventListener('click', () => {
  started = true;
  document.getElementById('start').style.display = 'none';
});

document.getElementById('cameraBtn').addEventListener('click', () => {
  firstPerson = !firstPerson;
  document.getElementById('cameraBtn').textContent = firstPerson ? '📷 CAMERA: CABIN' : '📷 CAMERA: FOLLOW';
});

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(started){
    if(keys.gas) speed += 20 * dt;
    else speed -= 5 * dt;
    if(keys.brake) speed -= 32 * dt;
    speed = THREE.MathUtils.clamp(speed, 0, 110);

    const steer = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
    truckX += steer * (1.6 + speed * 0.022) * dt;
    truckX = THREE.MathUtils.clamp(truckX, -4.2, 4.2);

    truck.position.x = truckX;
    cabin.rotation.y = -steer * 0.03;
    trailer.rotation.y = -steer * 0.015;

    const motion = speed * 0.18 * dt;
    distanceTravelled += motion;

    for(const d of dashes){
      d.position.z += motion;
      if(d.position.z > 15) d.position.z -= 400;
    }

    for(const obj of scenery){
      obj.position.z += motion;
      if(obj.position.z > 20) obj.position.z -= 320;
    }

    for(const wheel of wheels){
      wheel.rotation.x -= motion * 1.6;
    }

    for(const wheel of frontWheels){
      wheel.rotation.y = -steer * 0.12;
    }

    if(distanceTravelled >= 2000 && !completed){
      completed = true;
      document.getElementById('money').textContent = '₹ 500';
      document.getElementById('distance').textContent = 'Delivery completed! +₹500';
    }else if(!completed){
      const remain = Math.max(0, 2000 - distanceTravelled);
      document.getElementById('distance').textContent = 'Distance: ' + (remain / 1000).toFixed(2) + ' km';
    }
  }

  if(firstPerson){
    camera.position.set(truckX, 2.1, 3.2);
    camera.lookAt(truckX, 1.8, -10);
  }else{
    camera.position.x += (truckX * 0.5 - camera.position.x) * 0.08;
    camera.position.y += (4.8 - camera.position.y) * 0.06;
    camera.position.z += (9.5 - camera.position.z) * 0.06;
    camera.lookAt(truckX * 0.2, 1.2, -10);
  }

  document.getElementById('speed').innerHTML = Math.round(speed) + ' <span style="font-size:12px">km/h</span>';

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
